# Config for cargo-deny
#
# Advisories: newer cargo-deny versions removed vulnerability/notice lint
# levels. unmaintained/unsound now select which crates can fail the check
# (all | workspace | transitive | none), not warn/deny/allow.

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Match previous "warn" intent: do not fail CI on unmaintained/unsound crates.
unmaintained = "none"
unsound = "none"
yanked = "warn"

[licenses]
# Licenses not listed here are denied by default in current cargo-deny.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "AFL-3.0",
    "Artistic-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "EPL-1.0",
    "EPL-2.0",
    "EUPL-1.1",
    "EUPL-1.2",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "MS-PL",
    "MS-RL",
    "OFL-1.1",
    "OSL-3.0",
    "PostgreSQL",
    "UPL-1.0",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
